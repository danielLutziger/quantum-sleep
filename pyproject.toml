[project]
name = "quantum-sleep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "daniellutziger", email = "daniel.lutziger@uzh.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pennylane>=0.45.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
quantum-sleep = "quantum_sleep:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
